name: security-scan

on:
  workflow_call:
    inputs:
      sonar-host-url:
        description: SonarQube URL (vars.SONAR_HOST_URL)
        type: string
        required: true
      template:
        description: Service type, same as the build-push input (node, java)
        type: string
        default: node
    secrets:
      SONAR_TOKEN:
        description: SonarQube token with Execute Analysis permission
        required: true

env:
  SERVICE: ${{ github.event.repository.name }}

jobs:
  # trivy:
  #   runs-on: ubuntu-24.04
  #   timeout-minutes: 10
  #   permissions:
  #     contents: read

  #   steps:
  #     - name: Checkout service code
  #       uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

  #     # Download the official release binary and verify sha256 instead of trivy-action,
  #     # so we never depend on a tag that can be moved. To upgrade: change both lines,
  #     # sha256 comes from trivy_<version>_checksums.txt of the release.
  #     - name: Install trivy
  #       run: |
  #         VERSION=0.76.2
  #         SHA256=bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf
  #         FILE="trivy_${VERSION}_Linux-64bit.tar.gz"

  #         curl -fsSL -o "/tmp/${FILE}" "https://github.com/aquasecurity/trivy/releases/download/v${VERSION}/${FILE}"
  #         echo "${SHA256}  /tmp/${FILE}" | sha256sum -c -
  #         sudo tar -xzf "/tmp/${FILE}" -C /usr/local/bin trivy
  #         trivy --version

  #     # No vuln scan here: the image scan in build-push already does it, twice means duplicate reports
  #     - name: Trivy scan
  #       run: |
  #         trivy fs \
  #           --scanners secret,misconfig \
  #           --severity HIGH,CRITICAL \
  #           --exit-code 1 \
  #           --no-progress \
  #           .

  sonarqube:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      # SonarQube needs full git history for "new code" and blame
      - name: Checkout service code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Prepare
        id: prepare
        env:
          TEMPLATE: ${{ inputs.template }}
        run: |
          ARGS="-Dsonar.projectKey=${SERVICE} -Dsonar.qualitygate.wait=true -Dsonar.qualitygate.timeout=300"

          case "${TEMPLATE}" in
            node)
              ;;
            java)
              # Sonar needs .class files to analyse Java
              ARGS="${ARGS} -Dsonar.java.binaries=build/classes/java/main"
              ;;
            *)
              echo "::error::template ${TEMPLATE} not supported, only node or java"
              exit 1
              ;;
          esac

          echo "args=${ARGS}" >> "${GITHUB_OUTPUT}"
          echo "Project key: ${SERVICE}"
          echo "Sonar args:  ${ARGS}"

      # Compile with the same gradle image as docker/java/Dockerfile: same gradle/JDK version
      - name: Compile java
        if: inputs.template == 'java'
        run: |
          docker run --rm -v "${PWD}:/app" -w /app gradle:9.5.1-jdk21-alpine \
            gradle compileJava -P skipCheckstyle=true --no-daemon

      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          SONAR_HOST_URL: ${{ inputs.sonar-host-url }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: ${{ steps.prepare.outputs.args }}
