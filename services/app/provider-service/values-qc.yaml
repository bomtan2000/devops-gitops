# QC-only values. Argo CD in QC reads values.yaml, then this file (later file wins).
# Only what differs from dev. provider-service uses no IRSA, so no serviceAccount here.

image:
  # CI writes the release-vX.Y.Z tag here on a git tag. Keep the 2-space indent (CI uses sed).
  # Never empty: an empty tag makes the chart use appVersion 1.16.0 -> ImagePullBackOff.
  # Starts as the tag running in dev, until the first release.
  tag: "37f68bf1"
